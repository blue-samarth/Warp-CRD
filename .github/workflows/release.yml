name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag to publish
        required: true

permissions:
  contents: write
  packages: write

env:
  GOTOOLCHAIN: local
  REGISTRY: ghcr.io

jobs:
  release:
    name: Publish image and installer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Expressions are substituted into the script before any shell sees it,
      # so a dispatch input reaches the runner as code. Pass it through the
      # environment, quote it, and refuse anything that is not a version.
      - name: Resolve version
        id: version
        env:
          RAW_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if ! printf '%s' "$RAW_TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+([-.+][0-9A-Za-z.-]+)?$'; then
            echo "::error::refusing tag '$RAW_TAG'; expected vMAJOR.MINOR.PATCH"
            exit 1
          fi
          printf 'tag=%s\n' "$RAW_TAG" >> "$GITHUB_OUTPUT"

      # The image is what gets deployed, so it does not ship unless the same
      # commit passes the suite that CI runs on a pull request.
      - run: make test

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository }}:${{ steps.version.outputs.tag }}
            ${{ env.REGISTRY }}/${{ github.repository }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Render installer pinned to the published digest
        env:
          IMAGE_REF: ${{ env.REGISTRY }}/${{ github.repository }}@${{ steps.push.outputs.digest }}
        run: make build-installer IMG="$IMAGE_REF"

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/install.yaml
          generate_release_notes: true

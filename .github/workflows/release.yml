name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag to publish
        required: true

permissions:
  contents: read
  packages: read

env:
  GOTOOLCHAIN: local
  REGISTRY: ghcr.io

jobs:
  release:
    name: Publish image and installer
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Expressions are substituted into the script before any shell sees it,
      # so a dispatch input reaches the runner as code. Pass it through the
      # environment, quote it, and refuse anything that is not a version.
      - name: Resolve version
        id: version
        env:
          RAW_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          # Accept 1.2.3 or v1.2.3 and always publish v1.2.3: the push trigger
          # is v*, and a Go module version is invalid without the prefix.
          version=${RAW_TAG#v}
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([-.+][0-9A-Za-z.-]+)?$'; then
            echo "::error::refusing tag '$RAW_TAG'; expected v1.2.3 (or 1.2.3)"
            exit 1
          fi
          printf 'tag=v%s\n' "$version" >> "$GITHUB_OUTPUT"
          printf 'image=%s/%s\n' "$REGISTRY" \
            "$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
          # Only a final release moves :latest.
          if printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          fi

      # The image is what gets deployed, so it does not ship unless the same
      # commit passes the suite that CI runs on a pull request.
      - run: make test

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ steps.version.outputs.image }}:${{ steps.version.outputs.tag }}
            ${{ steps.version.outputs.prerelease == 'false' && format('{0}:latest', steps.version.outputs.image) || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Render installer pinned to the published digest
        env:
          IMAGE_REF: ${{ steps.version.outputs.image }}@${{ steps.push.outputs.digest }}
        run: make build-installer IMG="$IMAGE_REF"

      - name: Cross-compile the manager
        run: make dist-binaries VERSION=${{ steps.version.outputs.tag }}

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/install.yaml
            dist/bin/*.tar.gz
            dist/bin/SHA256SUMS
          generate_release_notes: true
          prerelease: ${{ steps.version.outputs.prerelease == 'true' }}

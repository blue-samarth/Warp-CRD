apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: controller-manager-metrics-monitor
  namespace: system
  labels:
    app.kubernetes.io/name: webapp-operator
    control-plane: controller-manager
spec:
  endpoints:
    - path: /metrics
      port: https
      scheme: https
      bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
      tlsConfig:
        # cert-manager writes the issuing CA into the same secret it serves
        # from. Verifying against it keeps the bearer token from reaching
        # anything that merely answers on the metrics address.
        ca:
          secret:
            name: metrics-server-cert
            key: ca.crt
        serverName: webapp-operator-controller-manager-metrics-service.system.svc
  selector:
    matchLabels:
      control-plane: controller-manager
